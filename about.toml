# The licenses of the crates Colophon ships, listed in its About dialog: generated with
#   cargo about generate -m apps/colophon/Cargo.toml --frozen about.hbs -o crates/ui-slint/licenses/third-party.json
# Slint's crates come without text, and a warning each: cargo-about leaves out the license they ship
# as Markdown, which the dialog shows from a copy beside the generated file.
# Accepted licenses, in order of preference where a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "LicenseRef-Slint-Royalty-free-2.0",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

