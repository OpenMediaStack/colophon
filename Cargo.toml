[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/florentsorel/colophon"

[workspace.dependencies]
colophon-engine = { path = "crates/engine" }
colophon-library = { path = "crates/library" }
colophon-player = { path = "crates/player" }
colophon-tags = { path = "crates/tags" }
colophon-ui = { path = "crates/ui-slint" }
arboard = { version = "3.6.1", default-features = false }
dirs = "7.0.0"
slint = "1.18.1"
slint-build = "1.18.1"
# The testing backend does not follow semver: it moves with slint, to the exact version.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
id3 = "1.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Unoptimised, decoding a track for its waveform takes ten seconds rather than a fifth of one: the
# decoder and the player build optimised even in debug builds, the rest as usual.
[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.dev.package.colophon-player]
opt-level = 3

# What ships carries no symbols: a sixth of the size.
[profile.release]
strip = true
