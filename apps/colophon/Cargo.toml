[package]
name = "colophon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Outside an app bundle, as under `cargo run`, macOS names the app after its executable.
[[bin]]
name = "Colophon"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
colophon-engine.workspace = true
colophon-player.workspace = true
colophon-ui.workspace = true
dirs.workspace = true
rfd.workspace = true
# Files dropped from the system reach the window through winit, which Slint does not wrap yet.
slint = { workspace = true, features = ["unstable-winit-030"] }

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[lints]
workspace = true
