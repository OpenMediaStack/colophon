name: Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - assets/icon/**
      - docs/assets/**
      - site/**
  # A pull request that changes the site builds it, without publishing it.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/pages.yml
      - assets/icon/**
      - docs/assets/**
      - site/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Publish the site
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
