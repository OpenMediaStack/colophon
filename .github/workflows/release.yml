name: Release

on:
  push:
    tags:
      - "v*"
  # A change to how Colophon is packaged builds the packages, to download from the run, without
  # releasing them.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/release.yml
      - apps/colophon/build.rs
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version, which a tag must match
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version of Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the disk image
        run: packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/dmg/Colophon-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked -p colophon
      # Inno Setup comes with GitHub's Windows images.
      - name: Build the installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.version.outputs.version }}" `
            packaging\windows\colophon.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/installer/Colophon-${{ needs.version.outputs.version }}-setup.exe
          if-no-files-found: error

  linux:
    name: Linux
    needs: version
    # The oldest Ubuntu GitHub offers: the AppImage runs where the glibc is at least as recent.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # cpal, which plays the sound, builds against ALSA.
      - name: Install Slint's system libraries and ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libasound2-dev
      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: target/appimage/Colophon-${{ needs.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Colophon ${{ needs.version.outputs.version }}" --generate-notes
