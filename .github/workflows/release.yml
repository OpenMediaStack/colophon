name: Release

# Only a version tag builds the packages, and releases them.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version, which the tag must match
        id: version
        run: |
          version=$(sed -n 's/^VERSION :: "\(.*\)"$/\1/p' src/app/window.odin | head -n 1)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $version of src/app/window.odin."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    name: Packages
    needs: version
    uses: ./.github/workflows/packages.yml

  release:
    name: Release
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' \) -print0 \
            | xargs -0 gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Colophon ${{ needs.version.outputs.version }}" --generate-notes
