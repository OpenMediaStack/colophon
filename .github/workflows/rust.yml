name: Rust

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request supersedes itself; a push to main is left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # File and line in backtraces, without the full debug info: faster builds, smaller caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Slint's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull request caches are only visible to their pull request; main's serve every branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # ffprobe reads back the files the round-trip tests write.
      - name: Install Slint's system libraries and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev ffmpeg
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull request caches are only visible to their pull request; main's serve every branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --workspace --locked
