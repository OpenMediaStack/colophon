name: Rust

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request supersedes itself; a push to main is left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Slint's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Slint's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
