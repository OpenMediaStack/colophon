name: Rust

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a pull request supersedes itself; a push to main is left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # File and line in backtraces, without the full debug info: faster builds, smaller caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  licenses:
    name: Third-party Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # The About dialog lists the crates of this file, which must follow Cargo.lock.
      - name: Check the licenses listed in the About dialog
        run: |
          cargo fetch --locked
          cargo about generate -m apps/colophon/Cargo.toml --frozen about.hbs \
            -o crates/ui-slint/licenses/third-party.json
          if ! git diff --exit-code --stat crates/ui-slint/licenses/third-party.json; then
            echo "::error::third-party.json is out of date: generate it as about.toml says."
            exit 1
          fi

  clippy:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # cpal, which plays the sound, builds against ALSA on Linux.
      - name: Install Slint's system libraries and ALSA
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libasound2-dev
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull request caches are only visible to their pull request; main's serve every branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # cpal builds against ALSA on Linux; ffprobe reads back the files the round-trip tests write.
      - name: Install Slint's system libraries, ALSA and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libasound2-dev ffmpeg
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull request caches are only visible to their pull request; main's serve every branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --workspace --locked
